# PLANTILLA para External Secrets Operator (ESO) — Opción B del README.
#
# Requiere:
#   - External Secrets Operator instalado en el cluster
#   - SecretStore o ClusterSecretStore que apunte a tu Vault/AWS/etc.
#   - Las entradas referenciadas (scormbuilder/api-keys) deben existir en el store

---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: scormbuilder
  labels:
    app.kubernetes.io/name: scormbuilder
spec:
  provider:
    vault:
      # Cambia por el endpoint de tu Vault
      server: "https://vault.vault.svc:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          # Role configurado en Vault que permite leer scormbuilder/*
          role: "scormbuilder"
          serviceAccountRef:
            name: scormbuilder-eso
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scormbuilder-eso
  namespace: scormbuilder
  labels:
    app.kubernetes.io/name: scormbuilder
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: scormbuilder-secrets
  namespace: scormbuilder
  labels:
    app.kubernetes.io/name: scormbuilder
spec:
  # Re-lectura periódica → rotación automática sin reinicios manuales.
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    # Nombre del Secret final, idéntico al que espera el Deployment.
    name: scormbuilder-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: scormbuilder
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: scormbuilder/api-keys
        property: anthropic
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: scormbuilder/api-keys
        property: smtp_password
