# NO APLIQUES ESTE FICHERO TAL CUAL — es solo un ejemplo.
#
# Crea el Secret real con `oc create secret generic` (no en yaml plano para que
# las claves no acaben en git). Ver instrucciones en deploy/README.md.
#
# Ejemplo de creación:
#   oc -n scormbuilder create secret generic scormbuilder-secrets \
#       --from-literal=ANTHROPIC_API_KEY='sk-ant-...' \
#       --from-literal=SMTP_PASSWORD=''   # opcional, déjalo vacío si no usas SMTP
#
# El Deployment monta este Secret como variables de entorno, NO como volumen.

apiVersion: v1
kind: Secret
metadata:
  name: scormbuilder-secrets
  namespace: scormbuilder
  labels:
    app.kubernetes.io/name: scormbuilder
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REEMPLAZA-AQUI"
  # SMTP_PASSWORD se usa SOLO si configuras envío de emails desde la app.
  # Si no, déjalo vacío o elimínalo.
  SMTP_PASSWORD: ""
